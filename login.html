
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Form</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>
    /* GENERAL STYLING */
    body {
        background-color: #f5f0fa;
        min-height: 100vh;
    }

    /* LOGIN CARD */
    .login-card {
        width: 100%;
        max-width: 400px;
        border: none;
        border-radius: 12px;
        background-color: white;
    }

    /* LOGIN HEADING */
    .login-title {
        color: #6f42c1;
        font-weight: 600;
    }

    /* INPUT FIELDS */
    .form-control {
        padding: 11px;
        border-radius: 7px;
    }

    .form-control:focus {
        border-color: #a78bfa;
        box-shadow: 0 0 0 0.15rem rgba(111, 66, 193, 0.15);
    }

    /* LOGIN BUTTON */
    .btn-purple {
        background-color: #6f42c1;
        color: white;
        border: none;
        border-radius: 7px;
    }

    .btn-purple:hover {
        background-color: #59339d;
        color: white;
    }

    /* FORGOT PASSWORD */
    a {
        color: #6f42c1;
    }

    a:hover {
        color: #59339d;
    }

    /* DECORATIVE ART */
    .welcome-art {
        display: none;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 480px) {
        .login-card {
            max-width: 100%;
        }
    }
</style>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

            <div class="background-shapes">
        <div class="shape shape-one"></div>
        <div class="shape shape-two"></div>
        <div class="shape shape-three"></div>
    </div>

        <div class="card login-card shadow p-4">

            <div class="card-body">

                <h2 class="text-center login-title mb-2">Welcome Back!</h2>

                <p class="text-center text-muted mb-4">
                    Please login to your account
                </p>

                <form id="loginForm">

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <!-- Remember Me -->
                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <div class="form-check">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="remember"
                            >

                            <label class="form-check-label" for="remember">
                                Remember me
                            </label>
                        </div>

                        <a href="#" class="text-decoration-none">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-purple w-100 py-2">
                        Login
                    </button>

                </form>

                    <div class="welcome-art">
                    <div class="art-circle circle-one"></div>
                    <div class="art-circle circle-two"></div>
                    <div class="art-circle circle-three"></div>
                    <div class="art-star star-one">✦</div>
                    <div class="art-star star-two">✧</div>
                    <div class="art-star star-three">✦</div>
                    <div class="art-center">3</div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Login form submitted successfully!");
        });
    </script>

</body>
</html>
